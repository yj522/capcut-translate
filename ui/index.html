<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CapCut Translate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>CapCut Translate</h1>
    <span id="capcutPill" class="pill">확인 중…</span>
    <span id="enginePill" class="pill"></span>
    <div class="spacer"></div>
    <button id="btnRefresh" class="ghost" title="목록 새로고침">새로고침</button>
    <button id="btnOpenRoot" class="ghost" title="CapCut 프로젝트 폴더 열기">폴더 열기</button>
    <button id="btnSettings" class="ghost">설정</button>
  </header>

  <main class="layout">
    <aside class="list">
      <input id="search" type="search" placeholder="프로젝트 검색">
      <div id="projects" class="projects"></div>
    </aside>

    <section id="detail" class="detail">
      <div class="empty">왼쪽에서 프로젝트를 고르세요.</div>
    </section>
  </main>

  <!-- 진행 팝업 -->
  <div id="jobModal" class="modal" hidden>
    <div class="card">
      <h2 id="jobTitle">작업 중</h2>
      <div id="jobLabel" class="job-label"></div>
      <div class="bar"><div id="jobBar"></div></div>
      <div id="jobDetail" class="muted"></div>
      <div id="jobElapsed" class="muted small"></div>
    </div>
  </div>

  <!-- 설정 -->
  <div id="settingsModal" class="modal" hidden>
    <form id="settingsForm" class="card wide">
      <h2>설정</h2>
      <label>CapCut 프로젝트 폴더
        <input name="draft_root" placeholder="비워 두면 자동으로 찾습니다">
        <span id="rootHint" class="muted small"></span>
      </label>
      <label>OpenAI API 키 <span class="muted small">(비워 두면 codex CLI 로그인으로 번역 — 느림)</span>
        <input name="openai_api_key" type="password" autocomplete="off" placeholder="sk-… (저장된 키는 다시 표시하지 않음)">
      </label>
      <label>OpenAI 모델
        <input name="openai_model" placeholder="gpt-4.1-mini">
      </label>
      <label>사본 이름 규칙 <span class="muted small">{name}=원래 이름, {lang}=언어 코드</span>
        <input name="name_pattern" placeholder="{name} [{lang}]">
      </label>
      <div class="row end">
        <button type="button" class="ghost" data-close>닫기</button>
        <button type="submit">저장</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
